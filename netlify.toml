# ---------------------------------------------------------------------------
# Netlify — Growly web app (free plan, no credit card).
#
# Netlify auto-detects the Nitro / TanStack Start build. Nitro writes the
# server function to `.netlify/v1/functions` and static assets to `dist`.
#
# Do NOT put secrets in this file. Set them in Netlify:
#   Site configuration → Environment variables
#
# Required there:
#   DATABASE_URL              Supabase *transaction* pooler, port 6543
#   VITE_SUPABASE_URL         https://<ref>.supabase.co  (baked at build time)
#   VITE_SUPABASE_ANON_KEY    publishable / anon key      (baked at build time)
#   SUPABASE_URL              same as VITE_SUPABASE_URL
#   SUPABASE_ANON_KEY         same as VITE_SUPABASE_ANON_KEY
#   SUPABASE_SERVICE_ROLE_KEY secret / service_role key (server only)
#   CREDENTIALS_ENCRYPTION_KEY  44-char base64 key (shared with the worker)
#   WORKER_API_TOKEN            64-char hex token (shared with the worker)
#   ADMIN_EMAILS              comma-separated admin emails
#   APP_ORIGIN                https://<your-site>.netlify.app (set after 1st deploy)
#   DATABASE_POOL_MAX         1 (serverless: one connection per invocation)
# ---------------------------------------------------------------------------

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NITRO_PRESET = "netlify"