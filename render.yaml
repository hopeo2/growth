# ---------------------------------------------------------------------------
# Render Blueprint — the Growly web app.
#
# The InstaPy worker does NOT run here (it needs Firefox and a long-running
# process). Host the worker on a VPS and point its WORKER_API_URL at this
# service's URL.
#
# How to use:
#   1. Push this repo to GitHub.
#   2. Render dashboard → New → Blueprint → pick the repo.
#   3. Render prompts for every `sync: false` value below, so secrets stay out
#      of git.
#   4. After the first deploy, copy the service URL (https://<name>.onrender.com)
#      and set it as APP_ORIGIN here (Environment tab), then set the same URL
#      as WORKER_API_URL on the worker host.
#
# Render supplies PORT; Nitro reads it. NITRO_PRESET=render-com selects the
# Render-optimised build and HOST=0.0.0.0 makes it listen on all interfaces.
# ---------------------------------------------------------------------------

services:
  - type: web
    name: growly
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      # --- Build/runtime settings (safe to commit) ---
      - key: NITRO_PRESET
        value: render-com
      - key: HOST
        value: 0.0.0.0
      - key: NODE_ENV
        value: production

      # --- Secrets: set in the Render dashboard, never committed ---
      # Supabase Postgres (transaction pooler, port 6543)
      - key: DATABASE_URL
        sync: false
      # Supabase Auth — VITE_* are baked into the browser bundle at build time
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Secrets shared with the worker
      - key: CREDENTIALS_ENCRYPTION_KEY
        sync: false
      - key: WORKER_API_TOKEN
        sync: false
      # Public URL of this service, e.g. https://growly.onrender.com
      - key: APP_ORIGIN
        sync: false
      # Comma-separated bootstrap admins
      - key: ADMIN_EMAILS
        sync: false
